[global]
   server role = standalone server
   workgroup = WORKGROUP
   security = user

   # Direct-hosted SMB only. NetBIOS/SMB1 discovery and guest access are disabled.
   smb ports = 445
   disable netbios = yes
   server min protocol = SMB2_10
   server max protocol = SMB3_11
   map to guest = never
   restrict anonymous = 2
   usershare allow guests = no

   # All messages must be signed. The share below additionally requires native
   # SMB3 transport encryption, so SMB2-only clients cannot access its contents.
   server signing = mandatory

   # This container is a file server only.
   load printers = no
   disable spoolss = yes
   printcap name = /dev/null
   dns proxy = no
   wide links = no
   allow insecure wide links = no

   # Keep logging low-volume; --debug-stdout sends it to the container log.
   log level = 1

   # macOS interoperability for Finder metadata/resource forks.
   fruit:aapl = yes
   fruit:model = FileManager
   fruit:nfs_aces = no

[files]
   path = /srv/media
   browseable = yes
   read only = no
   guest ok = no
   valid users = @fmshare
   force group = fmshare
   smb encrypt = required

   create mask = 0660
   force create mode = 0660
   directory mask = 0770
   force directory mode = 0770
   inherit permissions = yes
   inherit acls = yes
   map acl inherit = yes

   follow symlinks = no
   ea support = yes
   store dos attributes = yes
   delete readonly = yes

   vfs objects = catia fruit streams_xattr
   fruit:metadata = stream
   fruit:resource = file
   fruit:encoding = native
   fruit:veto_appledouble = yes
